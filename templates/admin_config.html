{% extends layout_template %}
{% block title %}System Configuration | M-ROFCO Hub{% endblock %}

{% block content %}
<div class="site-container max-w-2xl mx-auto py-6">
    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-6">
        <div class="border-b pb-4">
            <span class="text-xs font-bold text-slate-500 uppercase tracking-widest block mb-1">URD System Admin</span>
            <h1 class="text-2xl font-bold text-slate-900">Global Valuation Parameters</h1>
        </div>

        {% if success_msg %}
        <div class="p-4 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-xl text-xs font-semibold">
            {{ success_msg }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('admin_config') }}" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Sugarcane Factory Price (KES per Tonne)</label>
                <input type="number" name="sugarcane_price" value="{{ config.sugarcane_price if config else 5500 }}" step="50" required
                       class="w-full text-sm px-3.5 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500">
                <span class="text-xs text-slate-400">Updates live valuation calculations across all branch intakes.</span>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Standard Factory & Haulage Deduction (%)</label>
                <input type="number" name="deduction_rate" value="{{ config.deduction_rate if config else 15 }}" step="0.5" required
                       class="w-full text-sm px-3.5 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Maximum Loan-to-Value (LTV) Cap (%)</label>
                <input type="number" name="ltv_cap" value="{{ config.ltv_cap if config else 50 }}" step="1" required
                       class="w-full text-sm px-3.5 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500">
            </div>

            <button type="submit" class="w-full bg-slate-900 hover:bg-emerald-600 text-white font-bold py-3.5 rounded-xl transition-colors">
                Save Global Variables
            </button>
        </form>
    </div>
</div>
{% endblock %}
