<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ texts['login_title'] }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-image: linear-gradient(rgba(6, 78, 59, 0.75), rgba(6, 78, 59, 0.85)), url('/static/images/premium_agri_bg.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
    </style>
</head>
<body class="font-sans antialiased text-slate-800 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white/85 backdrop-blur-xl p-8 rounded-2xl shadow-2xl max-w-md w-full border border-white/40 text-center relative overflow-hidden">
        <!-- Top Accent Bar -->
        <div class="absolute top-0 left-0 w-full h-1.5 bg-emerald-600"></div>

        <!-- Lock Icon -->
        <div class="w-16 h-16 bg-emerald-50 rounded-2xl flex items-center justify-center mb-6 text-emerald-600 text-2xl shadow-sm border border-emerald-100 mx-auto">
            🔐
        </div>

        <h1 class="text-2xl font-extrabold text-emerald-950 tracking-tight">{{ texts['login_title'] }}</h1>
        <p class="text-xs text-slate-500 mt-1.5 mb-8 leading-relaxed max-w-xs mx-auto">Enter your staff username and secure password to access the M-ROFCO management records.</p>

        <!-- Error Banner -->
        {% if error %}
        <div class="mb-6 p-3 bg-red-50 border border-red-200 text-red-700 text-xs font-semibold rounded-xl flex items-center justify-center gap-2">
            <span>⚠️</span> {{ error }}
        </div>
        {% endif %}

        <!-- Secure Auth Input Form -->
        <form method="POST" class="space-y-5">
            <div class="text-left">
                <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">
                    Staff Role
                </label>
                <div class="relative">
                    <select 
                        name="role" 
                        id="role-select"
                        required
                        class="w-full text-sm font-medium bg-slate-50 border border-slate-200 rounded-xl py-3 px-4 text-slate-800 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all outline-none appearance-none"
                    >
                        <option value="" disabled selected>Select your assigned Role...</option>
                        <option value="Intake Agent">Intake Agent</option>
                        <option value="Field Assessor">Field Assessor</option>
                        <option value="Committee Member">Committee Member</option>
                        <option value="System Admin">System Admin</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-500">
                        <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                    </div>
                </div>
            </div>

            <div class="text-left">
                <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2 mt-4">
                    Username
                </label>
                <input 
                    type="text" 
                    name="username" 
                    placeholder="e.g. intake1" 
                    required
                    class="w-full text-sm font-medium bg-slate-50 border border-slate-200 rounded-xl py-3 px-4 text-slate-800 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all outline-none"
                >
            </div>
            

            
            <div class="text-left">
                <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">
                    Secure Password
                </label>
                <input 
                    type="password" 
                    name="password" 
                    placeholder="••••••••" 
                    required
                    class="w-full text-sm font-medium bg-slate-50 border border-slate-200 rounded-xl py-3 px-4 text-slate-800 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all outline-none"
                >
            </div>

            <div class="pt-4 space-y-3">
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 px-4 rounded-xl transition duration-200 shadow-md shadow-emerald-600/20 text-sm transform hover:-translate-y-0.5">
                    {{ texts['login_btn'] }} →
                </button>

                <a href="{{ url_for('toggle_language') }}" class="block w-full bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-600 font-bold py-2.5 px-4 rounded-xl transition duration-200 text-xs text-center">
                    {{ texts['switch_btn'] }}
                </a>
            </div>
        </form>
    </div>


</body>
</html>
