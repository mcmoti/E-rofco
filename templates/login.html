<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-ROFCO Authentication</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full border border-gray-100 text-center">
        <!-- Lock Icon for Authentication -->
        <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mb-6 text-green-600 text-2xl shadow-inner mx-auto">
            🔐
        </div>

        <h1 class="text-xl font-bold text-gray-800 tracking-tight">{{ texts['login_title'] }}</h1>
        <p class="text-xs text-gray-500 mt-1 mb-6 leading-relaxed max-w-xs mx-auto">{{ texts['login_subtext'] }}</p>

        <!-- Error Banner for Wrong PIN entries -->
        {% if error %}
        <div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-600 text-xs font-semibold rounded-xl">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        <!-- Secure PIN Input Form -->
        <form method="POST" class="space-y-5">
            <div class="text-left">
                <label class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-2">
                    {{ texts['pin_label'] }}
                </label>
                <input 
                    type="password" 
                    name="pin" 
                    pattern="[0-9]*" 
                    inputmode="numeric"
                    maxlength="4" 
                    placeholder="••••" 
                    required
                    class="w-full text-center tracking-widest text-2xl font-bold bg-gray-50 border border-gray-200 rounded-xl py-3 px-4 text-gray-800 focus:ring-2 focus:ring-green-500 focus:border-green-500 transition duration-150 outline-none"
                >
            </div>

            <div class="space-y-3 pt-2">
                <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-4 rounded-xl transition duration-200 shadow-sm text-sm">
                    {{ texts['login_btn'] }}
                </button>

                <a href="{{ url_for('toggle_language') }}" class="block w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-2.5 px-4 rounded-xl transition duration-200 text-xs">
                    {{ texts['switch_btn'] }}
                </a>
            </div>
        </form>
    </div>

</body>
</html>
