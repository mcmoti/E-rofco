<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-ROFCO Cooperative Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Modern Agricultural Theme */
        .bg-landing {
            background-image: linear-gradient(rgba(6, 78, 59, 0.8), rgba(6, 78, 59, 0.9)), url('https://images.unsplash.com/photo-1592982537447-6f296a054593?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="bg-[#fdfbf7] font-sans antialiased text-slate-800">

    <div class="min-h-screen flex flex-col">
        <!-- Header -->
        <header class="bg-white/90 backdrop-blur-md sticky top-0 z-50 border-b border-emerald-100 shadow-sm">
            <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-emerald-600 rounded-xl flex items-center justify-center text-white text-xl font-bold shadow-md shadow-emerald-600/30">
                        M
                    </div>
                    <span class="font-extrabold text-xl tracking-tight text-emerald-950">M-ROFCO</span>
                </div>
                <div class="flex items-center gap-4">
                    <a href="{{ url_for('toggle_language') }}" class="text-xs font-semibold text-emerald-700 hover:text-emerald-900 transition-colors uppercase tracking-wider">
                        🌐 {{ texts['switch_btn'] }}
                    </a>
                </div>
            </div>
        </header>

        <!-- Hero Section -->
        <main class="flex-grow bg-landing flex items-center justify-center py-20 px-6">
            <div class="max-w-3xl mx-auto text-center">
                <div class="inline-block mb-6 px-4 py-1.5 bg-emerald-500/20 border border-emerald-400/30 rounded-full backdrop-blur-sm">
                    <span class="text-emerald-50 text-xs font-bold uppercase tracking-widest">{{ texts['twende_pamoja'] }}</span>
                </div>
                
                <h1 class="text-5xl md:text-6xl font-extrabold text-white tracking-tight mb-6 leading-tight">
                    {{ texts['welcome'] }}
                </h1>
                
                <p class="text-lg md:text-xl text-emerald-100 mb-10 max-w-2xl mx-auto font-medium leading-relaxed">
                    {{ texts['subtext'] }}
                </p>
                
                <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
                    <a href="{{ url_for('policy') }}" class="w-full sm:w-auto bg-emerald-500 hover:bg-emerald-400 text-emerald-950 font-bold text-lg py-4 px-8 rounded-xl transition-all shadow-xl shadow-emerald-900/50 transform hover:-translate-y-0.5">
                        {{ texts['proceed'] }} →
                    </a>
                </div>
            </div>
        </main>
        
        <!-- Footer -->
        <footer class="bg-emerald-950 text-emerald-50 py-8 text-center border-t border-emerald-900">
            <p class="text-sm font-medium opacity-70">© 2026 M-ROFCO Cooperative Society Ltd. All rights reserved.</p>
        </footer>
    </div>

</body>
</html>
