<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-ROFCO Web Portal</title>
    <!-- Tailwind CSS Script for clean styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full border border-gray-100 text-center">
        <!-- Logo Placeholder (matches our Kivy icon approach) -->
        <div class="w-20 h-20 bg-green-600 rounded-full flex items-center justify-center mx-auto mb-6 text-white text-3xl font-bold shadow-md">
            M
        </div>

        <!-- Dynamic Headers based on selected language -->
        <h1 class="text-2xl font-bold text-gray-800 tracking-tight">{{ texts['welcome'] }}</h1>
        <p class="text-gray-500 mt-2 mb-8 text-sm">{{ texts['subtext'] }}</p>

        <div class="space-y-4">
            <!-- Proceed Action Button -->
            <a href="{{ url_for('policy') }}" class="block w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-4 rounded-xl transition duration-200 shadow-sm">
                {{ texts['proceed'] }}
            </a>

            <hr class="border-gray-200 my-4">

            <!-- Language Switcher Button -->
            <a href="{{ url_for('toggle_language') }}" class="block w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-2.5 px-4 rounded-xl transition duration-200 text-sm">
                {{ texts['switch_btn'] }}
            </a>
        </div>
    </div>

</body>
</html>
