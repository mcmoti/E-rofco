{% extends 'base.html' %}
{% block title %}Field Agronomist Assessment | M-ROFCO Hub{% endblock %}

{% block content %}
<div class="site-container max-w-2xl mx-auto py-6">
    
    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-6">
        
        <div class="border-b pb-4">
            <span class="text-xs font-bold text-emerald-600 uppercase tracking-widest block mb-1">Agronomist Field Audit</span>
            <h1 class="text-2xl font-bold text-slate-900">Physical Farm Inspection & Geotag</h1>
        </div>

        <form class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Target Member Account</label>
                <input type="text" value="MBR-8849 — Ogutu Nyo (Kibos Sector)" readonly
                       class="w-full text-sm px-3.5 py-2.5 rounded-lg bg-slate-100 border border-slate-300 font-semibold text-slate-700">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Verified Acreage</label>
                    <input type="number" step="0.1" placeholder="e.g. 3.5" required
                           class="w-full text-sm px-3.5 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Crop Stage</label>
                    <select class="w-full text-sm px-3.5 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500">
                        <option>Early Seedling (0-3 Months)</option>
                        <option>Vegetative Growth (4-9 Months)</option>
                        <option>Maturing / Harvest Ready (10-18 Months)</option>
                        <option>Ratoon Crop Stage</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">Agronomist Stand Health Assessment</label>
                <select class="w-full text-sm px-3.5 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500">
                    <option>Grade A — High Density Yield (>35 Tons/Acre)</option>
                    <option>Grade B — Average Yield (25-34 Tons/Acre)</option>
                    <option>Grade C — Below Average / Pest Risk (<24 Tons/Acre)</option>
                </select>
            </div>

            <!-- GPS Geotagging Input -->
            <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">Parcel GPS Geotag Coordinates</label>
                <div class="flex gap-2">
                    <input type="text" id="geoCoords" placeholder="Latitude, Longitude" readonly
                           class="w-full text-sm px-3.5 py-2.5 rounded-lg bg-slate-50 border border-slate-300 text-slate-600">
                    <button type="button" onclick="captureGPS()" class="bg-slate-800 text-white text-xs font-bold px-4 py-2.5 rounded-lg hover:bg-slate-700 whitespace-nowrap">
                        📍 Fetch GPS
                    </button>
                </div>
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">Inspection Notes & Risk Factors</label>
                <textarea rows="3" placeholder="Note access road conditions, factory transport distance, weed control status..."
                          class="w-full text-sm p-3.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500"></textarea>
            </div>

            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl transition-colors">
                Verify & Authorize Asset Value &rarr;
            </button>
        </form>

    </div>
</div>

<script>
function captureGPS() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(position) {
            document.getElementById('geoCoords').value = position.coords.latitude.toFixed(6) + ", " + position.coords.longitude.toFixed(6);
        }, function() {
            alert("Geolocation error or permission denied.");
        });
    } else {
        alert("Geolocation is not supported by this browser.");
    }
}
</script>
{% endblock %}
